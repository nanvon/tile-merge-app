name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      # macOS Build: .app only
      - name: Build macOS
        if: matrix.platform == 'macos-latest'
        run: tauri build --target ${{ matrix.target }}

      # Windows Build: portable exe only
      - name: Build Windows
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.target }} --no-bundle

      # Upload macOS .app (zipped)
      - name: Zip macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          zip -r "瓦片图合并工具_${{ github.ref_name }}_aarch64.zip" *.app

      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.zip

      # Upload Windows portable exe
      - name: Upload Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/${{ matrix.target }}/release/*.exe
