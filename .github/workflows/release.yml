name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm install
      - run: npm run tauri build -- --target aarch64-apple-darwin
      - name: Package
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          zip -r TileMerge.app.zip TileMerge.app
      - uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/TileMerge.app.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm install
      - run: npm run tauri build -- --target x86_64-pc-windows-msvc --no-bundle
      - uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/x86_64-pc-windows-msvc/release/TileMerge.exe
